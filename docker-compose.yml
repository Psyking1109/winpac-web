# For a permanent server:  docker compose up -d --build
# Runs the website and Caddy (automatic HTTPS for your domain).
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes: [winpac-data:/app/data]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

volumes:
  winpac-data:
  caddy-data:
